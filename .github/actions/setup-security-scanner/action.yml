name: Set up pinned Trivy
description: Install the official checksum-pinned scanner through the release asset API
runs:
  using: composite
  steps:
    - name: Install Trivy 0.76.2
      shell: bash
      run: |
        set -euo pipefail
        [[ "$(uname -s)" == Linux && "$(uname -m)" == x86_64 ]]
        work="$(mktemp -d "${RUNNER_TEMP:-/tmp}/capbox-trivy.XXXXXX")"
        archive="$work/trivy.tar.gz"
        # Fixed release asset, bypassing the failing website/telemetry redirect.
        curl -fsSL --retry 3 --connect-timeout 10 --max-time 120 \
          -H 'Accept: application/octet-stream' -o "$archive" \
          https://api.github.com/repos/aquasecurity/trivy/releases/assets/713401165
        printf '%s  %s\n' bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf "$archive" | sha256sum -c -
        mkdir "$work/bin"
        tar --no-same-owner -xzf "$archive" -C "$work/bin" trivy
        chmod 0755 "$work/bin/trivy"
        "$work/bin/trivy" --version
        printf '%s\n' "$work/bin" >> "$GITHUB_PATH"
