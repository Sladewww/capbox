<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CapBox 运行监控</title>
<style>
:root{color-scheme:dark;font:15px system-ui,sans-serif;background:#101418;color:#e7edf2}
*{box-sizing:border-box}
body{max-width:1160px;margin:auto;padding:32px 24px}
header,.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:27px;margin:0}h2{font-size:16px;margin:0}
section{background:#181f26;border:1px solid #303b45;border-radius:10px;padding:18px;margin-top:14px;min-width:0}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.details{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.45fr);gap:14px}
dl{display:grid;grid-template-columns:1fr auto;gap:10px;margin:16px 0 0}
dt,small,th{color:#aab9c6}dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
table{width:100%;text-align:left;border-collapse:collapse;margin-top:14px;font-size:13px}
td,th{padding:9px 8px;border-bottom:1px solid #303b45;overflow-wrap:anywhere}
tbody tr:last-child td{border:0}
.table-wrap{overflow:auto;max-height:25rem}
thead{position:sticky;top:0;background:#181f26}
[data-tone="ok"]{color:#79d8ac}[data-tone="warn"]{color:#f3c785}
[data-tone="error"]{color:#ffa69e}
@media(max-width:760px){.summary,.details{grid-template-columns:1fr}body{padding:18px 12px}}
</style>
<script src="/monitor.js" defer></script>
</head>
<body>
<header><h1>CapBox 运行监控</h1><small id="connection" role="status">正在连接</small></header>
<main>
  <div class="summary">
    <section><div class="section-title"><h2>运行概览</h2><small id="overview-time"></small></div><dl id="overview"></dl></section>
    <section><div class="section-title"><h2>资源限制</h2><small id="resources-time"></small></div><dl id="resources"></dl></section>
    <section><div class="section-title"><h2>实时用量</h2><small id="usage-time"></small></div><dl id="usage"></dl></section>
  </div>
  <div class="details">
    <section><div class="section-title"><h2>服务</h2><small id="services-time"></small></div>
      <div class="table-wrap"><table aria-label="服务"><thead><tr><th>名称</th><th>状态</th></tr></thead><tbody id="services"></tbody></table></div>
    </section>
    <section><div class="section-title"><h2>最近任务</h2><small id="tasks-time"></small></div>
      <div class="table-wrap"><table aria-label="最近任务"><thead><tr><th>任务 ID</th><th>状态</th><th>创建时间</th><th>退出码</th></tr></thead><tbody id="tasks"></tbody></table></div>
    </section>
  </div>
  <section><div class="section-title"><h2>最近审计事件</h2><small id="audit-time"></small></div>
    <div class="table-wrap"><table aria-label="最近审计事件"><thead><tr><th>发生时间</th><th>事件</th><th>结果</th><th>退出码</th><th>耗时</th></tr></thead><tbody id="audit"></tbody></table></div>
  </section>
</main>
</body>
</html>
