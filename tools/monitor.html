<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CapBox 运行监控</title>
<style>
:root {
  color-scheme: light;
  --bg: #f5f6fa;
  --panel: #fff;
  --ink: #202637;
  --muted: #71798d;
  --line: #e8eaf1;
  --indigo: #5146d8;
  --teal: #148774;
  --red: #cf4262;
  --amber: #a86a19;
  font: 14px Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); }
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: 212px; z-index: 2;
  padding: 32px 22px; background: #171b2e; color: #d4d7e5;
}
.brand { display: flex; align-items: center; gap: 11px; color: white; font-size: 23px; font-weight: 700; letter-spacing: -.7px; }
.mark { display: grid; grid-template-columns: repeat(2, 8px); gap: 3px; transform: rotate(-7deg); }
.mark i { width: 8px; height: 8px; border-radius: 2px; background: #a79cff; }
.mark i:nth-child(2) { background: #d5d0ff; }
.mark i:nth-child(3) { background: #6759db; }
.nav { display: grid; gap: 8px; margin-top: 44px; }
.nav a { padding: 12px; border-radius: 8px; color: #aeb5cd; text-decoration: none; font-size: 13px; }
.nav a:first-child { background: #2b2c4d; color: #e0dbff; }
.nav a:hover { background: #272c43; color: white; }
a:focus-visible { outline: 3px solid #9d97f7; outline-offset: 3px; }
main { margin-left: 212px; padding: 35px 42px 32px; max-width: 1760px; }
.topline, .section-title { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
.breadcrumb, .section-title small { color: var(--muted); font-size: 12px; }
.breadcrumb span { color: #aaaec0; padding: 0 10px; }
.local-tag { font-size: 11px; border: 1px solid #d8e9e1; border-radius: 20px; padding: 6px 11px; background: #e7f4ee; }
.local-tag[data-tone="warn"] { border-color: #f2e1c7; background: #fff4e3; }
h1 { font-size: 30px; letter-spacing: -1px; font-weight: 680; margin: 26px 0 25px; }
h2 { font-size: 15px; font-weight: 620; margin: 0; }
section { min-width: 0; scroll-margin-top: 16px; }
.card, .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.card { padding: 20px; box-shadow: 0 2px 3px #1f234003; }
.summary, .details { display: grid; gap: 16px; margin-bottom: 24px; }
.summary { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.details { grid-template-columns: minmax(0, 1fr) minmax(0, 1.45fr); }
dl { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; margin: 18px 0 0; font-size: 12px; }
dt { color: var(--muted); }
dd { margin: 0; color: #424c63; text-align: right; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.panel { overflow: hidden; }
section > .section-title + .panel { margin-top: 12px; }
table { width: 100%; text-align: left; border-collapse: collapse; font-size: 12px; }
th { position: sticky; top: 0; background: #fafbfe; color: #71798d; font-weight: 500; border-bottom: 1px solid var(--line); }
td, th { padding: 12px 16px; overflow-wrap: anywhere; }
td { color: #566075; border-bottom: 1px solid #eff1f6; }
tbody tr:hover { background: #fbfaff; }
tbody tr:last-child td { border-bottom: 0; }
.table-wrap { overflow: auto; max-height: 25rem; }
.mono { font-family: "Cascadia Code", Consolas, monospace; font-size: 11px; font-variant-numeric: tabular-nums; }
.kind-pill { display: inline-block; padding: 3px 6px; border: 1px solid #e9e6f7; border-radius: 4px; background: #f0effa; color: #75649e; }
.status-pill { display: inline-flex; align-items: baseline; gap: 5px; }
.status-pill::before { content: ""; flex: 0 0 5px; height: 5px; border-radius: 50%; background: currentColor; }
[data-tone="ok"] { color: var(--teal); }
[data-tone="warn"] { color: var(--amber); }
[data-tone="error"] { color: var(--red); }
@media (max-width: 1100px) {
  main { padding-inline: 24px; }
  .details { grid-template-columns: 1fr; }
}
@media (max-width: 920px) {
  .sidebar { position: static; width: auto; padding: 16px 24px; }
  .nav { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
  main { margin-left: 0; padding-top: 22px; }
}
@media (max-width: 720px) {
  .summary { grid-template-columns: 1fr; }
  main { padding-inline: 16px; }
  td, th { padding-inline: 9px; }
}
</style>
<script src="/monitor.js" defer></script>
</head>
<body>
<aside class="sidebar">
  <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>CapBox</div>
  <nav class="nav" aria-label="监控导航">
    <a href="#summary">运行概览</a>
    <a href="#service-panel">服务</a>
    <a href="#task-panel">最近任务</a>
    <a href="#audit-panel">审计事件</a>
  </nav>
</aside>
<main>
  <header>
    <div class="topline">
      <div class="breadcrumb">CapBox<span aria-hidden="true">/</span>运行监控</div>
      <small class="local-tag" id="connection" role="status">正在连接</small>
    </div>
    <h1>CapBox 运行监控</h1>
  </header>
  <div class="summary" id="summary">
    <section class="card"><div class="section-title"><h2>运行概览</h2><small id="overview-time"></small></div><dl id="overview"></dl></section>
    <section class="card"><div class="section-title"><h2>资源限制</h2><small id="resources-time"></small></div><dl id="resources"></dl></section>
    <section class="card"><div class="section-title"><h2>实时用量</h2><small id="usage-time"></small></div><dl id="usage"></dl></section>
  </div>
  <div class="details">
    <section id="service-panel"><div class="section-title"><h2>服务</h2><small id="services-time"></small></div>
      <div class="panel table-wrap"><table aria-label="服务"><thead><tr><th scope="col">名称</th><th scope="col">状态</th></tr></thead><tbody id="services"></tbody></table></div>
    </section>
    <section id="task-panel"><div class="section-title"><h2>最近任务</h2><small id="tasks-time"></small></div>
      <div class="panel table-wrap"><table aria-label="最近任务"><thead><tr><th scope="col">任务 ID</th><th scope="col">状态</th><th scope="col">创建时间</th><th scope="col">退出码</th></tr></thead><tbody id="tasks"></tbody></table></div>
    </section>
  </div>
  <section id="audit-panel"><div class="section-title"><h2>最近审计事件</h2><small id="audit-time"></small></div>
    <div class="panel table-wrap"><table aria-label="最近审计事件"><thead><tr><th scope="col">发生时间</th><th scope="col">事件</th><th scope="col">结果</th><th scope="col">退出码</th><th scope="col">耗时</th></tr></thead><tbody id="audit"></tbody></table></div>
  </section>
</main>
</body>
</html>
